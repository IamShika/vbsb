<!doctype html>

<style>

#tm{width:130px;margin:0 auto;text-align:center;font-weight:700;font-size:28px;line-height:1.3;transition:color .3s var(--ez)}
#tm.pz{color:#2b1d00;text-shadow:none;border-color:#ffe08a;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 60%),rgba(255,190,20,.92)}
#r{display:flex;height:76px;margin-top:-1px}
#r>*+*,#h div+div{margin-left:-1px}

#T0{background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 55%),color-mix(in srgb,var(--a) 90%,transparent)}
#T1{flex-direction:row-reverse;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 55%),color-mix(in srgb,var(--b) 90%,transparent)}
#g0,#g1{height:52px;width:52px;object-fit:contain}
.nm{display:flex;flex-direction:column;min-width:0;flex:1}
#T0 .nm{align-items:flex-end;text-align:right}

#tm{border-radius:0}
#g0,#g1,#ug0,#ug1{opacity:0;transform:translateY(14px);transition:opacity .45s var(--ez),transform .55s var(--ez)}

#ti span{font-family:var(--fb,"Noto Sans Thai","Noto Sans",system-ui,sans-serif)}
:root{--ff:"Noto Sans Thai","Noto Sans",system-ui,sans-serif;--sh:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 55%)}

<style id="skin">
/* solid skin: flat colors, black tiles between the team colors, glow on numbers, banner text and the ball */
:root{--ink:#06080d;--ink2:#10141f;--gold:#ffc82e;--mint:#2ee6a6;--ice:#eef5ff;--fa:#fff;--fb2:#fff}
body{text-shadow:none}
#tm,.t,.w,.p,.dash,#ti,#h div,.gl,.tc{-webkit-backdrop-filter:none;backdrop-filter:none;border:0;box-shadow:none;background:var(--ink)}
#tm{color:var(--ice)}
#tm.pz{background:var(--gold);color:#1a1200}
#T0,#T1,#U0,#U1{background:var(--ink);color:#fff}
.p{background:var(--ink);color:#fff}
.w{background:var(--ink2);color:var(--mint)}

@property --bp{syntax:'<length>';inherits:true;initial-value:0px}

@property --bb{syntax:'<color>';inherits:true;initial-value:#19c6ff}
:root{--ba:#ff0033;--bb:#19c6ff;transition:--ba .7s var(--ez),--bb .7s var(--ez)}
.t,.tc,#tt,.p,.w{position:relative;isolation:isolate}

<script>
const WS = "wss://volley-board.doramongameing.workers.dev";
const q = id => document.getElementById(id);
const EZ = "cubic-bezier(0.109,0.575,0.333,0.974)", RM = matchMedia("(prefers-reduced-motion:reduce)").matches;
let T = { ok: 0 }, first = true, D = null, off = 0, curB = null, hs = [], LG = ["", ""], FL = {}, M = null, MV = null, TA = null, mt = 0, CB = {};

// tally-counter roll: score up = new number rises in; score down = the opposite
function roll(el, v, skip, u){
  const old = el.lastElementChild; if(old.textContent == String(v)) return;
  if(skip){ old.textContent = v; return; }
  const up = u === undefined ? +v > +old.textContent : u, n = document.createElement("span"); n.textContent = v; el.appendChild(n);
  const o = { duration: RM ? 0 : 450, easing: EZ, fill: "both" };
  n.animate([{ transform: `translateY(${up ? "100%" : "-100%"})`, opacity: 0 }, { transform: "none", opacity: 1 }], o);
  old.animate([{ transform: "none", opacity: 1 }, { transform: `translateY(${up ? "-100%" : "100%"})`, opacity: 0 }], o).onfinish = () => old.remove();
}
// banner / subheader lines rotate on server time so every screen shows the same line
function pick(L, d){ L = (L || []).map(x => x.trim()).filter(Boolean); if(!L.length) return "";
  return L[(d.as ? Math.floor((Date.now() + off) / (1000 * (d.ms || 5))) : (d.li || 0)) % L.length]; }
function tickB(skip){
  if(!D) return;
  [["ti", D.ml ? pick(D.ls, D) : ""], ["wb", pick(D.ls, D)], ["ws", pick(D.wl, D)]].forEach(([id, b]) => {
    if(b === CB[id]) return; CB[id] = b; const el = q(id), hid = el.style.display === "none";
    el.style.display = b ? "" : "none"; if(b) roll(el, b, skip || hid, true); });
}
// screen change: old view fades up and out, new one rises in (same curve as everything else)
function setMode(m, skip){
  if(m === M) return; const old = M && q("v"+M), nx = q("v"+m), tm = q("tm"), tk = ++mt; M = m;
  const OUT = [{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(-18px)" }],
        IN = [{ opacity: 0, transform: "translateY(18px)" }, { opacity: 1, transform: "none" }];
  const go = () => { if(TA){ TA.cancel(); TA = null; } if(tk !== mt) return; MV = m; nx.style.display = "";
    tm.style.display = (D.timer || m === "t") ? "" : "none";
    const o = { duration: skip || RM ? 0 : 500, easing: EZ }; nx.animate(IN, o); tm.animate(IN, o); };
  if(old && !skip && !RM){ // the timer moves with the screen: out with the old view, in with the new one
    TA = tm.animate(OUT, { duration: 300, easing: EZ, fill: "forwards" });
    old.animate(OUT, { duration: 300, easing: EZ }).onfinish = () => { old.style.display = "none"; go(); }; }
  else { if(old) old.style.display = "none"; go(); }
}
function logo(i, u){
  if(LG[i] === u) return; LG[i] = u; const els = [q("g"+i), q("ug"+i)]; els.forEach(e => e.classList.remove("on"));
  if(!u){ setTimeout(() => { if(!LG[i]) els.forEach(e => e.style.display = "none"); }, 550); return; }
  const im = new Image();
  im.onload = () => { if(LG[i] !== u) return; els.forEach(e => { e.src = u; e.style.display = ""; }); void els[0].offsetWidth; els.forEach(e => e.classList.add("on")); };
  im.src = u; // logo fades in only after it has loaded successfully
}
function font(v, file){
  const st = document.documentElement.style;
  if(!file){ FL[v] = ""; st.removeProperty(v); return; }
  if(FL[v] === file) return; FL[v] = file;
  const fam = "f_" + file.replace(/[^a-z0-9]/gi, "_"), ff = new FontFace(fam, `url("../fonts/${encodeURI(file)}")`);
  ff.load().then(f => { document.fonts.add(f); if(FL[v] === file) st.setProperty(v, `"${fam}","Noto Sans Thai",system-ui,sans-serif`); }).catch(() => {});
}
function curMs(){ if(!T.ok) return 0; const e = Date.now() - T.la; return Math.max(0, T.ev === "p" ? (e < T.dur ? T.fz : e - T.dur) : e); }
function fg(c){ const n = parseInt(c.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) > 140 ? "#111a2b" : "#fff"; }
new Image().src = "../img/vbblk.png"; // preload so the swap never flickers
function set(id, v){ const el = q(id); if(el.textContent !== String(v)) el.textContent = v; }

// ---- team colour fills ---------------------------------------------------------------
// Every team block has a .fl wrapper that holds colour layers over a black base. A colour change slides the
// old layer up and out while the new one rises in; the text inside follows the same moving edge, switching
// between white and dark contrast exactly where the edge crosses it.
const PC = new Map();   // wrapper -> colour it shows (or is sliding to); null = black
let HOLD = false;       // true while the swap sequence drives the colours
function mkLayer(c){ const l = document.createElement("div"); l.className = "fc"; l.style.background = c; return l; }
function visible(el){ return !!(el.offsetWidth || el.offsetHeight); }
function fin(fl){ if(fl._fin) fl._fin(); }
function cur(fl){ return fl._fin ? fl._to : (PC.has(fl) ? PC.get(fl) : null); }
function paint(fl, c){   // instant, no animation
  fin(fl); fl.replaceChildren(); if(c) fl.appendChild(mkLayer(c)); PC.set(fl, c);
  if(!fl.classList.contains("bar")) fl.parentElement.style.color = c ? fg(c) : "#fff";
}
function slide(fl, to){  // null = black. Resolves when the slide has finished.
  if(cur(fl) === to) return Promise.resolve();
  fin(fl);
  const from = PC.has(fl) ? PC.get(fl) : null, bar = fl.classList.contains("bar"), o = fl.parentElement;
  if(RM || !visible(fl)){ paint(fl, to); return Promise.resolve(); }
  return new Promise(res => {
    const down = to === null, opt = { duration: 600, easing: EZ, fill: "both" }, an = [];
    const oldL = fl.lastElementChild, newL = to ? mkLayer(to) : null;
    if(newL){ fl.appendChild(newL); an.push(newL.animate([{ transform: "translateY(100%)" }, { transform: "none" }], opt)); }
    if(oldL) an.push(oldL.animate([{ transform: "none" }, { transform: down ? "translateY(100%)" : "translateY(-100%)" }], opt));
    let nodes = [];
    if(!bar){ // text: above the edge / below the edge get their own contrast colour
      const f0 = from ? fg(from) : "#fff", f1 = to ? fg(to) : "#fff", H = o.offsetHeight;
      o.style.setProperty("--fo", down ? f1 : f0); o.style.setProperty("--fw", down ? f0 : f1);
      o.classList.add("wp");
      const top = o.getBoundingClientRect().top; nodes = [...o.querySelectorAll(".gt, .big, .d")];
      nodes.forEach(n => n.style.setProperty("--y0", (n.getBoundingClientRect().top - top) + "px"));
      an.push(o.animate([{ "--bp": (down ? 0 : H) + "px" }, { "--bp": (down ? H : 0) + "px" }], opt));
    }
    const done = () => { if(fl._fin !== done) return; fl._fin = null; an.forEach(a => a.cancel());
      if(oldL) oldL.remove(); if(!to) fl.replaceChildren();
      if(!bar){ o.classList.remove("wp"); nodes.forEach(n => n.style.removeProperty("--y0")); o.style.color = to ? fg(to) : "#fff"; }
      PC.set(fl, to); res(); };
    fl._to = to; fl._fin = done; an[0].onfinish = done;
  });
}
const fillOf = id => q(id).firstElementChild;
function targets(d){ const L = [];
  [0,1].forEach(i => ["T"+i, "U"+i, "p"+i, "w"+i].forEach(id => L.push([fillOf(id), d.c[i]])));
  L.push([fillOf("tt"), d.tt == null ? "#888" : d.c[d.tt]]); return L; }
function addFl(id, bar){ const f = document.createElement("div"); f.className = "fl" + (bar ? " bar" : ""); q(id).prepend(f); }
[0,1].forEach(i => { addFl("T"+i); addFl("U"+i); addFl("p"+i, 1); addFl("w"+i, 1); ["n"+i, "c"+i, "un"+i].forEach(id => q(id).classList.add("gt")); });
addFl("tt");

// swap sides: colours slide down to black, names/scores/logos change behind the black, new colours slide up
let SW = null, busy = false, queued = null;
function recv(d){
  if(busy){ queued = d; return; }
  const sw = d.sw || 0;
  if(first){ first = false; SW = sw; render(d, true); return; }
  if(sw !== SW){ SW = sw; swapSeq(d); return; }
  render(d, false);
}
async function swapSeq(d){
  busy = true; HOLD = true;
  await Promise.all(targets(d).map(([fl]) => slide(fl, null)));
  render(d, true);
  await Promise.all(targets(d).map(([fl, c]) => slide(fl, c)));
  HOLD = false; busy = false;
  if(queued){ const n = queued; queued = null; recv(n); }
}

function render(d, skip){
  const r = document.documentElement.style; // banner gradient fades to the new team colours
  if(skip) r.transition = "none"; r.setProperty("--ba", d.c[0]); r.setProperty("--bb", d.c[1]); if(skip){ void document.documentElement.offsetWidth; r.transition = ""; }
  if(!HOLD) targets(d).forEach(([fl, c]) => skip ? paint(fl, c) : slide(fl, c));
  [0,1].forEach(i => { const dk = fg(d.c[i]) !== "#fff", s = dk ? "../img/vbblk.png" : "../img/vb.png"; // black ball image on yellow-ish teams
    ["v", "ub"].forEach(p => { const e = q(p+i); e.classList.toggle("dk", dk); if(e.getAttribute("src") !== s) e.setAttribute("src", s); }); });
  for(const k of "nbspte"){ font("--f"+k, d["f"+k] || ""); document.documentElement.style.setProperty("--z"+k, (d["z"+k] || 100) / 100); }
  let w = [0,0]; d.sc.forEach((s,i) => { if(i < d.set){ if(s[0] > s[1]) w[0]++; else if(s[1] > s[0]) w[1]++; } });
  [0,1].forEach(i => {
    set("n"+i, d.t[i]); set("c"+i, d.rec[i] || ""); q("c"+i).style.display = (d.rec[i] || "").trim() ? "" : "none"; roll(q("p"+i), d.sc[d.set][i], skip); roll(q("w"+i), w[i], skip);
